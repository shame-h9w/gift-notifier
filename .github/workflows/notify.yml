# ПРОФИТ-нотификатор NFT-подарков: cron каждые 5 минут, каждый воркер живёт
# RUN_SECONDS (~5.3 ч) — итого покрытие ≈24/7. Пока воркер активен, повторные
# расписанные запуски GitHub пропускает автоматически.
name: gifts-notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "Сколько секунд жить этому воркеру"
        default: "19000"

permissions:
  contents: write

concurrency:
  group: gifts-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 352
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet -r requirements.txt

      - name: Run gift notifier
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_TARGET: ${{ secrets.CHANNEL_TARGET }}
          RUN_SECONDS: ${{ github.event.inputs.run_seconds || '19000' }}
        run: python bot.py
        continue-on-error: true

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state || true
          if ! git diff --cached --quiet; then
            git commit -m "state: seen gifts"
            git pull --rebase || true
            git push
          fi
